# Relaxed yamllint config for our own manifests (the vendored k8s/base is excluded).
extends: default
rules:
  line-length:
    max: 160
    level: warning
  document-start: disable
  comments-indentation: disable
  comments:
    min-spaces-from-content: 1
  truthy:
    check-keys: false
  indentation:
    spaces: 2
    indent-sequences: true
