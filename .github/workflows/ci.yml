name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint shellcheck
          curl -fsSL -o /usr/local/bin/kubectl \
            https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl
          sudo chmod +x /usr/local/bin/kubectl

      - name: Validate (terraform fmt/validate, config, yamllint, shellcheck, kustomize)
        run: STRICT=1 ./scripts/validate.sh
