name: cd-deploy

# Continuous delivery: provision infra + deploy the stack, keyless via Workload
# Identity Federation (no service-account keys). Runs on merge to main or on
# demand. The privileged apply/deploy is gated behind the 'production'
# Environment (manual approval).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # REQUIRED to mint the GitHub OIDC token for WIF

env:
  TF_VERSION: "1.15.5"
  CLUSTER: boutique-bench
  ZONE: us-central1-a

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: terraform plan
        run: |
          terraform -chdir=terraform init -input=false
          terraform -chdir=terraform plan -input=false

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    environment: production # <-- manual-approval gate (set a required reviewer in GitHub)
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin
      - name: Install kubectl
        run: |
          curl -fsSL -o /tmp/kubectl https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

      - name: Provision infrastructure (scripts/apply-infra.sh)
        run: ./scripts/apply-infra.sh

      - name: Get cluster credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.ZONE }}

      - name: Deploy + functional health checks (scripts/deploy.sh)
        run: ./scripts/deploy.sh
