# Cloud Build pipeline: provision infrastructure + deploy the full stack.
# Calls the SAME scripts as `make` (single source of truth) — no inlined kubectl.
#
#   gcloud builds submit --config cloudbuild/provision.yaml
#
# The Cloud Build service account needs: container.admin, compute.admin,
# iam.serviceAccountUser/Admin, monitoring.admin, resourcemanager.projectIamAdmin
# (Workload Identity bindings), storage.admin (TF state).
substitutions:
  _ZONE: us-central1-a
  _CLUSTER: boutique-bench

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1) Provision infra with Terraform (scripts/apply-infra.sh; remote state in GCS).
  - id: terraform-apply
    name: hashicorp/terraform:1.15
    entrypoint: sh
    args: ["scripts/apply-infra.sh"]

  # 2) Fetch cluster credentials (gke-gcloud-auth-plugin ships in the gcloud image).
  - id: get-credentials
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud container clusters get-credentials "$_CLUSTER" \
          --zone "$_ZONE" --project "$PROJECT_ID"
        cp -r /root/.kube /workspace/.kube

  # 3) Deploy monitoring + one Online Boutique per selected platform, then run
  #    functional health checks — all via scripts/deploy.sh (which calls
  #    scripts/healthcheck.sh). Same code path as `make deploy`.
  - id: deploy-and-healthcheck
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env:
      - KUBECONFIG=/workspace/.kube/config
    args: ["scripts/deploy.sh"]

timeout: 2400s
