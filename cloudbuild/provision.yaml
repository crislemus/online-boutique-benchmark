# Cloud Build pipeline: provision infrastructure + deploy the full stack.
# Trigger manually or on push to main.
#
#   gcloud builds submit --config cloudbuild/provision.yaml
#
# The Cloud Build service account needs: container.admin, compute.admin,
# iam.serviceAccountUser, monitoring.admin, storage.admin (for TF state).
# (In this exercise's project the runtime SA has Editor but cannot set IAM
# policy; run from an account/SA that can, or pre-grant these roles.)
substitutions:
  _ZONE: us-central1-a
  _CLUSTER: boutique-bench

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1) Provision infra with Terraform (remote state in GCS).
  - id: terraform-apply
    name: hashicorp/terraform:1.15
    entrypoint: sh
    args:
      - -c
      - |
        cd terraform
        terraform init -input=false
        terraform apply -auto-approve -input=false

  # 2) Fetch cluster credentials (gke-gcloud-auth-plugin ships in the gcloud image).
  - id: get-credentials
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: sh
    args:
      - -c
      - |
        gcloud container clusters get-credentials "$_CLUSTER" \
          --zone "$_ZONE" --project "$PROJECT_ID"
        cp -r /root/.kube /workspace/.kube

  # 3) Deploy monitoring + both Online Boutique copies.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: sh
    env:
      - KUBECONFIG=/workspace/.kube/config
    args:
      - -c
      - |
        kubectl -n gmp-public patch operatorconfig config --type=merge \
          -p '{"collection":{"kubeletScraping":{"interval":"30s"}}}'
        kubectl apply -f k8s/monitoring/00-namespace.yaml
        kubectl apply -f k8s/monitoring/20-gmp-frontend.yaml
        kubectl create configmap grafana-dashboards -n monitoring \
          --from-file=dashboards/ --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -f k8s/monitoring/30-grafana.yaml
        kubectl apply -k k8s/overlays/boutique-n2
        kubectl apply -k k8s/overlays/boutique-c3
        kubectl rollout status deploy/frontend -n boutique-n2 --timeout=300s
        kubectl rollout status deploy/frontend -n boutique-c3 --timeout=300s

timeout: 2400s
