apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Copy of Online Boutique pinned to the N2 (previous-gen Intel) node pool.
namespace: boutique-n2

resources:
  - namespace.yaml
  - ../../base

# Common label to select this copy in PromQL / dashboards.
commonLabels:
  proc: n2

patches:
  # Pin every workload to the N2 processor pool via the node label set in Terraform.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          proc: n2

  # Drop the external LoadBalancer Service; we don't need a public IP per copy
  # (smoke tests use kubectl port-forward; load comes from the in-cluster loadgenerator).
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend-external
      $patch: delete
