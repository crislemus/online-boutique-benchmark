apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Copy of Online Boutique pinned to the C3 (new-gen Intel Sapphire Rapids) node pool.
namespace: boutique-c3

resources:
  - namespace.yaml
  - ../../base

# Common label to select this copy in PromQL / dashboards.
commonLabels:
  proc: c3

patches:
  # Pin every workload to the C3 processor pool via the node label set in Terraform.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          proc: c3

  # Drop the external LoadBalancer Service (see N2 overlay for rationale).
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend-external
      $patch: delete
